name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            biber ghostscript latexmk poppler-utils ripgrep \
            texlive-bibtex-extra texlive-fonts-recommended \
            texlive-latex-extra texlive-pictures texlive-science

      - name: Build and verify release
        run: make release

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: latex-for-all-pdfs
          path: book/output/pdf/*.pdf
          if-no-files-found: error
